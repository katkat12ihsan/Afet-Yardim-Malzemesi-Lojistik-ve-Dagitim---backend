  <path class="cizgi" d="M870,360 H930"/>
  <text class="kard" x="874" y="354">1</text><text class="kard" x="918" y="354">N</text>
  <text class="fiil" x="900" y="376" text-anchor="middle">istenir</text>
  <!-- İhtiyaçTalebi N-1 İhtiyaçNoktası -->
  <path class="cizgi" d="M1050,456 V560"/>
  <text class="kard" x="1056" y="472">N</text><text class="kard" x="1056" y="554">1</text>
  <text class="fiil" x="1056" y="516">talep eder</text>
  <!-- Depo 1-N Dağıtım -->
  <path class="cizgi" d="M150,476 V560"/>
  <text class="kard" x="156" y="492">1</text><text class="kard" x="156" y="554">N</text>
  <text class="fiil" x="156" y="522">gönderir</text>
  <!-- Dağıtım 1-N DağıtımKalemi -->
  <path class="cizgi" d="M270,620 H630"/>
  <text class="kard" x="274" y="614">1</text><text class="kard" x="618" y="614">N</text>
  <text class="fiil" x="450" y="614" text-anchor="middle">içerir</text>
  <!-- Malzeme 1-N DağıtımKalemi -->
  <path class="cizgi" d="M750,436 V560"/>
  <text class="kard" x="756" y="452">1</text><text class="kard" x="756" y="554">N</text>
  <text class="fiil" x="756" y="502">dağıtılır</text>
