    <text class="alan" x="10" y="46">id</text><text class="anahtar" x="230" y="46">PK</text>
    <text class="alan" x="10" y="66">ad</text>
    <text class="alan" x="10" y="86">tur</text>
    <text class="alan" x="10" y="106">telefon</text>
    <text class="alan" x="10" y="126">eposta</text>
