  <!-- ===================== AÇIKLAMA ===================== -->
  <g transform="translate(30,852)" font-size="11.5">
    <rect width="12" height="12" y="-10" fill="#2e7d32"/><text x="18" fill="#37474f">Bağış (giriş)</text>
    <rect x="120" width="12" height="12" y="-10" fill="#ef6c00"/><text x="138" fill="#37474f">Depo / stok</text>
    <rect x="235" width="12" height="12" y="-10" fill="#1565c0"/><text x="253" fill="#37474f">Tanım tabloları</text>
    <rect x="370" width="12" height="12" y="-10" fill="#c62828"/><text x="388" fill="#37474f">İhtiyaç ve dağıtım (çıkış)</text>
    <text x="580" fill="#37474f">PK birincil · FK yabancı anahtar · N-N ilişkiler ara tablolarla çözüldü</text>
  </g>
</svg>
