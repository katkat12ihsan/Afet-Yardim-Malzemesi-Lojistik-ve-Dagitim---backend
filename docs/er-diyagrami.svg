    <text class="alan" x="10" y="86">ihtiyac_noktasi_id</text><text class="anahtar" x="230" y="86">FK</text>
    <text class="alan" x="10" y="106">planlanan_tarih</text>
    <text class="alan" x="10" y="126">teslim_tarihi</text>
    <text class="alan" x="10" y="146">durum</text>
