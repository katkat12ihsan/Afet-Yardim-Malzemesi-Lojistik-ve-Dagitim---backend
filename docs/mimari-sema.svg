<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <style>
    .katman { stroke-width: 1.5; rx: 8; }
    .ad { font-size: 15px; font-weight: 700; fill: #263238; }
    .yol { font-size: 12px; fill: #546e7a; font-family: Consolas, monospace; }
    .ic { font-size: 12.5px; fill: #37474f; }
    .ok { stroke: #37474f; stroke-width: 1.8; fill: none; marker-end: url(#ok); }
    .kesik { stroke: #8d6e63; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#ok); }
  </style>
  <rect width="960" height="640" fill="#fafafa"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#263238">P16 · Mimari Şema — Katmanlı Masaüstü Uygulaması (Python)</text>

  <!-- Kullanıcı -->
  <rect x="200" y="58" width="360" height="40" rx="20" fill="#eceff1" stroke="#78909c"/>
  <text x="380" y="83" text-anchor="middle" class="ic">Kullanıcı: yardım kuruluşu / depo görevlisi</text>
  <path class="ok" d="M380,98 V122"/>

  <!-- Sunum -->
  <rect class="katman" x="60" y="124" width="640" height="96" fill="#e3f2fd" stroke="#1565c0"/>
  <text class="ad" x="80" y="150">1 · Sunum Katmanı</text><text class="yol" x="680" y="150" text-anchor="end">frontend</text>
  <text class="ic" x="80" y="176">AnaPencere (Tkinter/ttk): sol menü, içerik alanı, durum çubuğu</text>
  <text class="ic" x="80" y="198">Envanter · Bağış · İhtiyaç · Dağıtım · Takip · Rapor sayfaları</text>
  <path class="ok" d="M380,220 V250"/>

  <!-- İş -->
  <rect class="katman" x="60" y="252" width="640" height="96" fill="#e8f5e9" stroke="#2e7d32"/>
  <text class="ad" x="80" y="278">2 · İş Katmanı</text><text class="yol" x="680" y="278" text-anchor="end">backend/services</text>
  <text class="ic" x="80" y="304">Doğrulama ve iş kuralları · stok giriş/çıkış · ihtiyaç–stok eşleştirme</text>
  <text class="ic" x="80" y="326">Dağıtım planı · öncelik/rota önerisi (YZ) · şeffaflık raporu</text>
  <path class="ok" d="M380,348 V378"/>

  <!-- Veri -->
  <rect class="katman" x="60" y="380" width="640" height="84" fill="#fff3e0" stroke="#ef6c00"/>
  <text class="ad" x="80" y="406">3 · Veri Erişim Katmanı</text><text class="yol" x="680" y="406" text-anchor="end">backend/data</text>
  <text class="ic" x="80" y="432">database.py: bağlantı (PRAGMA foreign_keys = ON)</text>
  <text class="ic" x="80" y="452">Repository sınıfları: CRUD sorguları (Hafta 4)</text>
  <path class="ok" d="M380,464 V500"/>

  <!-- DB -->
  <g transform="translate(300,500)">
    <ellipse cx="80" cy="10" rx="80" ry="12" fill="#ffe0b2" stroke="#ef6c00"/>
    <path d="M0,10 V62 A80,12 0 0 0 160,62 V10" fill="#ffe0b2" stroke="#ef6c00"/>
    <ellipse cx="80" cy="10" rx="80" ry="12" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="80" y="42" text-anchor="middle" class="ad" font-size="14">SQLite</text>
    <text x="80" y="60" text-anchor="middle" class="yol">afet_lojistik.db</text>
  </g>

  <!-- Varlık katmanı (dikey) -->
  <rect class="katman" x="740" y="124" width="190" height="340" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text class="ad" x="835" y="150" text-anchor="middle">Varlık Katmanı</text>
  <text class="yol" x="835" y="170" text-anchor="middle">backend/models</text>
  <text class="ic" x="760" y="200">Kategori · Malzeme</text>
  <text class="ic" x="760" y="222">Depo · Stok</text>
  <text class="ic" x="760" y="244">Bağışçı · Bağış</text>
  <text class="ic" x="760" y="266">BağışKalemi</text>
  <text class="ic" x="760" y="288">İhtiyaçNoktası</text>
  <text class="ic" x="760" y="310">İhtiyaçTalebi</text>
  <text class="ic" x="760" y="332">Dağıtım · DağıtımKalemi</text>
  <text class="ic" x="760" y="370" font-size="11.5">Tüm katmanların ortak</text>
  <text class="ic" x="760" y="388" font-size="11.5">kullandığı dataclass'lar;</text>
  <text class="ic" x="760" y="406" font-size="11.5">hiçbir katmana bağımlı</text>
  <text class="ic" x="760" y="424" font-size="11.5">değildir.</text>
  <path d="M700,172 H740 M700,300 H740 M700,422 H740" stroke="#6a1b9a" stroke-width="1.3" stroke-dasharray="3 3"/>

  <!-- Harici servisler -->
  <rect x="740" y="520" width="190" height="64" rx="8" fill="#efebe9" stroke="#8d6e63"/>
  <text class="ad" x="835" y="546" text-anchor="middle" font-size="13.5">Harici servisler</text>
  <text class="ic" x="835" y="568" text-anchor="middle">Harita-Rota API · LLM API</text>
  <path class="kesik" d="M700,320 H720 V552 H738"/>
  <text class="ic" x="560" y="612" font-size="11.5" fill="#8d6e63">Kesikli ok: Hafta 9-10'da eklenecek bağlantı</text>

  <!-- FRONTEND / BACKEND ayrımı -->
  <path d="M50,126 H44 V218 H50" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="34" y="172" transform="rotate(-90 34 172)" text-anchor="middle" font-size="12" font-weight="700" fill="#1565c0">FRONTEND</text>
  <path d="M50,254 H44 V462 H50" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="34" y="358" transform="rotate(-90 34 358)" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">BACKEND</text>

  <text class="ic" x="30" y="612" font-size="11.5">Bağımlılık yönü tek yönlü: Sunum → İş → Veri</text>
</svg>
