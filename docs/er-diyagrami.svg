  <path class="cizgi" d="M1050,776 V815 H120 V736"/>
  <text class="kard" x="1056" y="796">1</text><text class="kard" x="126" y="754">N</text>
  <text class="fiil" x="585" y="808" text-anchor="middle">teslim alır</text>

