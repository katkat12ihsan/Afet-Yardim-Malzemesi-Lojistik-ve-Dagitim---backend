    <path d="M0,6 a6,6 0 0 1 6,-6 h228 a6,6 0 0 1 6,6 v22 h-240 z" fill="#c62828"/>
    <text class="baslik" x="120" y="19">İHTİYAÇ_NOKTASI</text>
    <text class="alan" x="10" y="46">id</text><text class="anahtar" x="230" y="46">PK</text>
    <text class="alan" x="10" y="66">ad</text>
    <text class="alan" x="10" y="86">il</text>
    <text class="alan" x="10" y="106">ilce</text>
    <text class="alan" x="10" y="126">adres</text>
    <text class="alan" x="10" y="146">enlem</text>
    <text class="alan" x="10" y="166">boylam</text>
    <text class="alan" x="10" y="186">nufus_tahmini</text>
