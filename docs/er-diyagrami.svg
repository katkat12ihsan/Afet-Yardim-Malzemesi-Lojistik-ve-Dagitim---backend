<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .kutu { fill: #ffffff; stroke: #455a64; stroke-width: 1.4; }
    .baslik { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .alan { fill: #263238; font-size: 12px; }
    .anahtar { fill: #6a1b9a; font-size: 10.5px; font-weight: 700; text-anchor: end; }
    .cizgi { fill: none; stroke: #546e7a; stroke-width: 1.6; }
    .kard { fill: #b71c1c; font-size: 12px; font-weight: 700; }
    .fiil { fill: #546e7a; font-size: 10.5px; font-style: italic; }
  </style>
  <rect width="1200" height="880" fill="#fafafa"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#263238">P16 · Afet Yardım Malzemesi Lojistik ve Dağıtım — ER Diyagramı</text>

  <!-- ===================== İLİŞKİ ÇİZGİLERİ ===================== -->
  <!-- Bağışçı 1-N Bağış -->
  <path class="cizgi" d="M270,110 H330"/>
  <text class="kard" x="274" y="104">1</text><text class="kard" x="318" y="104">N</text>
  <text class="fiil" x="300" y="126" text-anchor="middle">yapar</text>
  <!-- Bağış 1-N BağışKalemi -->
  <path class="cizgi" d="M570,110 H630"/>
  <text class="kard" x="574" y="104">1</text><text class="kard" x="618" y="104">N</text>
  <text class="fiil" x="600" y="126" text-anchor="middle">içerir</text>
  <!-- BağışKalemi N-1 Malzeme -->
  <path class="cizgi" d="M700,196 V300"/>
  <text class="kard" x="706" y="212">N</text><text class="kard" x="706" y="294">1</text>
  <text class="fiil" x="706" y="262">bağışlanır</text>
  <!-- Kategori 1-N Malzeme -->
  <path class="cizgi" d="M1050,136 V250 H800 V300"/>
