  <text class="fiil" x="925" y="244" text-anchor="middle">sınıflandırır</text>
  <!-- Depo 1-N Bağış -->
  <path class="cizgi" d="M450,196 V250 H210 V300"/>
  <text class="kard" x="456" y="212">N</text><text class="kard" x="216" y="294">1</text>
  <text class="fiil" x="330" y="244" text-anchor="middle">teslim alır</text>
  <!-- Depo 1-N Stok -->
  <path class="cizgi" d="M270,360 H330"/>
  <text class="kard" x="274" y="354">1</text><text class="kard" x="318" y="354">N</text>
  <text class="fiil" x="300" y="376" text-anchor="middle">tutar</text>
  <!-- Stok N-1 Malzeme -->
  <path class="cizgi" d="M570,360 H630"/>
  <text class="kard" x="574" y="354">N</text><text class="kard" x="620" y="354">1</text>
  <text class="fiil" x="600" y="376" text-anchor="middle">stoklanır</text>
