    <text class="alan" x="10" y="66">dagitim_id</text><text class="anahtar" x="230" y="66">FK</text>
    <text class="alan" x="10" y="86">malzeme_id</text><text class="anahtar" x="230" y="86">FK</text>
    <text class="alan" x="10" y="106">miktar</text>
  </g>
  <!-- İHTİYAÇ NOKTASI -->
  <g transform="translate(930,560)">
